<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column (phone first). Report list -> report editor with section tabs; a sticky action bar carries "Create PDF". */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e9efeb; --ink:#152620; --muted:#5b6d66; --line:#d3ddd8;
  --brand:#0b7a3e; --brand-ink:#ffffff; --brand-soft:#dcefe3;
  --ok:#1d7a45; --ok-bg:#dcf1e3; --warn:#9a5d00; --warn-bg:#fdeccb; --bad:#b4302a; --bad-bg:#fbe1de; --na:#66756f; --na-bg:#e5ebe8;
  --focus:#1b6fb5; --shadow:0 1px 2px rgba(20,40,30,.07),0 3px 12px rgba(20,40,30,.05);
  --f-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1714; --surface:#15211d; --surface-2:#1c2b26; --ink:#e3ece8; --muted:#97aaa2; --line:#2b3d36;
  --brand:#3fbf7a; --brand-ink:#06140d; --brand-soft:#173a29;
  --ok:#5fcf8c; --ok-bg:#163525; --warn:#f0b54a; --warn-bg:#3b2e11; --bad:#ff8a7f; --bad-bg:#40201d; --na:#9fb0a9; --na-bg:#22312c;
  --focus:#71b5f0; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1714; --surface:#15211d; --surface-2:#1c2b26; --ink:#e3ece8; --muted:#97aaa2; --line:#2b3d36;
  --brand:#3fbf7a; --brand-ink:#06140d; --brand-soft:#173a29;
  --ok:#5fcf8c; --ok-bg:#163525; --warn:#f0b54a; --warn-bg:#3b2e11; --bad:#ff8a7f; --bad-bg:#40201d; --na:#9fb0a9; --na-bg:#22312c;
  --focus:#71b5f0; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono,input.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.top .mark{width:34px;height:34px;flex:none}
.top .ttl{min-width:0;flex:1}
.top .ttl b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:99px;padding:0 6px}
.tab .n.warn{background:var(--warn-bg);color:var(--warn)}.tab .n.bad{background:var(--bad-bg);color:var(--bad)}

main{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.card>h2{font-size:19px}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 0;max-width:68ch}
.pagehead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:26px;font-weight:700}
.pagehead p{margin:2px 0 0;color:var(--muted);max-width:62ch}

.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.f>span.l{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 9px;min-height:40px;font-size:16px}
@media (min-width:700px){input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],select,textarea{font-size:14px}}
textarea{resize:vertical;min-height:70px}
.hint{font-size:12px;color:var(--muted)}
.hint.bad{color:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;min-height:40px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1}

/* checklist rows: item | chips | details */
.ck{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ci{border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:6px 14px;align-items:start}
.ci:first-child{border-top:0;padding-top:0}
.ci>.lab{font-weight:600;padding-top:6px}
.ci>.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:620px){.ci{grid-template-columns:minmax(0,1fr)}.ci>.lab{padding-top:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;min-height:34px;cursor:pointer;font-weight:500;font-size:13px}
.chip[aria-pressed="true"].ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip[aria-pressed="true"].warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chip[aria-pressed="true"].bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip[aria-pressed="true"].na{background:var(--na-bg);color:var(--ink);border-color:var(--na)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.na{background:var(--na-bg);color:var(--na)}

.invpills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center}
.ip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* nameplate */
.plate{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px;align-items:start}
@media (max-width:620px){.plate{grid-template-columns:minmax(0,1fr)}}
.plate img{width:100%;border-radius:7px;border:1px solid var(--line);display:block}
.kv{display:grid;grid-template-columns:minmax(100px,42%) minmax(0,1fr);gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.t input{min-height:36px;padding:5px 7px}
table.t td.cell-in{min-width:84px}
.scroll{overflow-x:auto}
tr.low td{background:var(--warn-bg)}

.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rep{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.rep:hover{border-color:var(--brand)}
.rep b{font-size:15px;overflow-wrap:anywhere}
.rep .meta{color:var(--muted);font-size:12.5px}
.ex{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:13px}

.summary{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.summary .big{font-family:var(--f-display);font-size:24px;font-weight:700}
.attn{margin:0;padding-left:18px;font-size:13px}
.attn li+li{margin-top:2px}
.attn .bad{color:var(--bad)}.attn .warn{color:var(--warn)}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
table.et td.cell-in{min-width:96px}
.thinv{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ndbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;min-height:34px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.ndbtn.icon{padding:4px;min-height:30px;min-width:30px;justify-content:center;border-radius:7px}
.ndbtn:hover{border-color:var(--warn)}
.ndbtn[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.ndcell{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:2px 9px;white-space:nowrap}
.ndnote{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--warn);border-radius:8px;padding:12px;background:var(--warn-bg)}
.ndmark{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--warn)}
.ndnote input{background:var(--surface)}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ph{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;max-width:100%}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pad{width:100%;height:140px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:flex-end}
.bar .st{margin-right:auto;font-size:12.5px;color:var(--muted);min-width:0;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
@media (max-width:400px){.bar{gap:6px;padding-inline:12px}.bar .btn{padding-inline:10px}}

.ov{position:fixed;inset:0;z-index:60;background:rgba(10,20,15,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.dlg{background:var(--surface);border-radius:12px;max-width:720px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h2{font-size:21px}
.cropwrap{position:relative;background:var(--surface-2);border-radius:8px;overflow:hidden;touch-action:none}
.cropwrap canvas{display:block;width:100%;height:auto;max-width:100%}
.rv{display:grid;grid-template-columns:24px minmax(110px,180px) minmax(0,1fr);gap:6px 10px;align-items:center}
.rv .cur{grid-column:3;font-size:11.5px;color:var(--muted);margin-top:-4px}
.rv input[type=checkbox]{width:18px;height:18px}
.rv .unclear{color:var(--warn);font-weight:600}
.prog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:8px;z-index:80;max-width:calc(100% - 32px);font-size:13.5px}
footer.notice{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0 110px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;gap:4px}
footer.notice b{color:var(--ink)}
.home-logo{height:72px;width:auto;flex:none}
@media (max-width:480px){.home-logo{height:56px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

const $ = (s, e = document) => e.querySelector(s);

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2, '0');

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dFmt = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? m[3] + '-' + MON[+m[2] - 1] + '-' + m[1] : (s || ''); };
const mFmt = s => { const m = /^(\d{4})-(\d{2})/.exec(s || ''); return m ? MON[+m[2] - 1] + ' ' + m[1] : (s || ''); };
const num = v => { if (v == null) return NaN; let s = String(v).trim(); if (!s) return NaN; if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, ''); else s = s.replace(',', '.'); s = s.replace(/\s+/g, ''); return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN; };
const isN = v => isFinite(num(v));
const fix = (x, d = 0) => isFinite(x) ? x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : '';
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);

function median(a) { const s = [...a].sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : NaN; }

/* ============ data model ============ */
function monthsBefore(dateStr, n = 6) {
  const d = /^\d{4}-\d{2}/.test(dateStr || '') ? new Date(+dateStr.slice(0, 4), +dateStr.slice(5, 7) - 1, 1) : new Date();
  const out = []; for (let i = n; i >= 1; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + pad2(x.getMonth() + 1)); }
  return out;
}
const newString = n => ({ no: String(n), v: '', i: '', p: '' });
function newInverter(n, months = 6) {
  const inv = { id: uid(), no: 'INV-' + pad2(n), sn: '', loc: '', plate: {}, plateOther: [], platePhoto: '', strings: [], energy: Array(months).fill(''), noData: false, noDataNote: '', fault: { desc: '', parts: '', warranty: '', remarks: '' } };
  SECTIONS.forEach(s => { inv[s.key] = {}; s.items.forEach(([k]) => (inv[s.key][k] = { s: '', n: '' })); });
  for (let i = 1; i <= 10; i++) inv.strings.push(newString(i));
  return inv;
}
function newReport() {
  const d = today();
  return {
    id: 'r' + uid(), v: 1, created: Date.now(), updated: Date.now(), example: false,
    site: { plant: '', location: '', date: d, type: 'Scheduled', reportNo: 'SR-' + d.replace(/-/g, '') + '-' + Math.floor(Math.random() * 90 + 10), kwp: '', engineer: '', client: '', contact: '', ref: '' },
    invs: [newInverter(1)],
    months: monthsBefore(d),          // the same six months for every inverter
    photos: [], comments: '',
    sign: { eng: { name: '', date: d, sig: '' }, cli: { name: '', date: d, sig: '' } }
  };
}
function normalize(r) { // tolerate older / imported data
  const base = newReport(), src = r || {};
  const months = Array.isArray(src.months) && src.months.length ? src.months.slice(0, 12)
    : Array.isArray(src.energy) && src.energy.length ? src.energy.map(e => (e && e.m) || '') : base.months;
  r = Object.assign(base, src); r.months = months;
  r.site = Object.assign(newReport().site, r.site || {});
  if (!Array.isArray(r.invs) || !r.invs.length) r.invs = [newInverter(1)];
  r.invs = r.invs.map((x, i) => { const b = newInverter(i + 1); const o = Object.assign(b, x || {}); SECTIONS.forEach(s => { o[s.key] = Object.assign(b[s.key], (x || {})[s.key] || {}); }); o.fault = Object.assign(newInverter(1).fault, o.fault || {}); if (!Array.isArray(o.strings)) o.strings = b.strings; if (!Array.isArray(o.plateOther)) o.plateOther = []; o.plate = o.plate || {}; return o; });
  r.invs.forEach((inv, i) => { // energy is kept per inverter (older reports kept one plant figure)
    if (!Array.isArray(inv.energy)) inv.energy = [];
    if (i === 0 && r.invs.length === 1 && Array.isArray(src.energy) && !inv.energy.some(Boolean)) inv.energy = src.energy.map(e => (e && e.kwh) || '');
    inv.energy = inv.energy.slice(0, months.length).map(v => (v == null ? '' : String(v)));
    while (inv.energy.length < months.length) inv.energy.push('');
  });
  delete r.energy;
  if (!Array.isArray(r.photos)) r.photos = [];
  r.sign = r.sign || base.sign; ['eng', 'cli'].forEach(k => (r.sign[k] = Object.assign({ name: '', date: '', sig: '' }, r.sign[k] || {})));
  return r;
}

/* ============ storage (IndexedDB, per device) ============ */
const DB = { name: 'regen-service-report', store: 'reports', db: null, mem: new Map(), ok: true };
function idb() {
  if (DB.db || !DB.ok) return Promise.resolve(DB.db);
  return new Promise(res => {
    try {
      const q = indexedDB.open(DB.name, 1);
      q.onupgradeneeded = () => q.result.createObjectStore(DB.store, { keyPath: 'id' });
      q.onsuccess = () => { DB.db = q.result; res(DB.db); };
      q.onerror = () => { DB.ok = false; res(null); };
    } catch (e) { DB.ok = false; res(null); }
  });
}
async function dbAll() {
  const d = await idb(); if (!d) return [...DB.mem.values()];
  return new Promise(res => { try { const q = d.transaction(DB.store).objectStore(DB.store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } });
}
async function dbPut(r) {
  const d = await idb(); if (!d) { DB.mem.set(r.id, structuredClone(r)); return true; }
  return new Promise(res => { try { const tx = d.transaction(DB.store, 'readwrite'); tx.objectStore(DB.store).put(r); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
}
async function dbDel(id) {
  const d = await idb(); if (!d) { DB.mem.delete(id); return; }
  return new Promise(res => { try { const tx = d.transaction(DB.store, 'readwrite'); tx.objectStore(DB.store).delete(id); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
}
const LS = { get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

/* ============ status / findings ============ */
function stringRows(inv) {
  const rows = inv.strings.map(s => { const v = num(s.v), i = num(s.i), pm = num(s.p); const p = isFinite(pm) ? pm : (isFinite(v) && isFinite(i) ? v * i : NaN); return { s, v, i, p, auto: !isFinite(pm) && isFinite(p) }; });
  const med = median(rows.filter(r => isFinite(r.i) && r.i > 0).map(r => r.i));
  rows.forEach(r => (r.low = isFinite(med) && isFinite(r.i) && r.i < med * 0.9));
  return { rows, med };
}
function findings(r = R) {
  const out = [];
  r.invs.forEach(inv => {
    SECTIONS.forEach(sec => sec.items.forEach(([k, label]) => {
      const it = inv[sec.key][k]; const t = toneOf(sec.key, k, it.s);
      if (t === 'warn' || t === 'bad') out.push({ tone: t, inv: inv.no, text: `${label}: ${it.s}${it.n ? ' – ' + it.n : ''}` });
    }));
    stringRows(inv).rows.forEach(x => { if (x.low) out.push({ tone: 'warn', inv: inv.no, text: `String ${x.s.no}: current ${fix(x.i, 2)} A is more than 10% below the median` }); });
    if ((inv.fault.desc || '').trim()) out.push({ tone: 'bad', inv: inv.no, text: 'Fault: ' + inv.fault.desc.trim() });
  });
  return out;
}
function progress(r = R) { let done = 0, all = 0; r.invs.forEach(inv => SECTIONS.forEach(sec => sec.items.forEach(([k]) => { all++; if (inv[sec.key][k].s) done++; }))); return { done, all }; }

const SERIES = ['#0b7a3e', '#2f6fb0', '#d98a00', '#8a4fb3', '#169c9c', '#b5523b', '#5d6b66', '#7a9a1e'];

const daysIn = m => { const mm = /^(\d{4})-(\d{2})/.exec(m || ''); return mm ? new Date(+mm[1], +mm[2], 0).getDate() : 30; };
function energyStats(r = R) {
  const kwp = num(r.site.kwp), sum = a => a.reduce((x, y) => x + y, 0);

function chartSVG(st, r = R) {

  const W = 640, H = 230, L = 56, Rr = 10, T = 18, B = 34, iw = W - L - Rr, ih = H - T - B, ni = Math.max(1, ser.length);
  const mx = Math.max(0, ...st.rows.flatMap(x => ser.map(sr => { const v = sr.v(x); return isFinite(v) ? v : 0; })));

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly energy generated per inverter, kWh">`;
  for (let v = 0; v <= top + 1e-9; v += step) { const y = T + ih - v / top * ih; s += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fix(v)}</text>`; }

      s += `<rect x="${bx + 0.5}" y="${T + ih - h}" width="${Math.max(1, bw - 1)}" height="${h}" rx="2" fill="${sr.col}"><title>${esc(sr.name)} · ${esc(mFmt(x.m))}: ${fix(v)} kWh</title></rect>`;
      if (ni === 1) s += `<text x="${bx + bw / 2}" y="${T + ih - h - 4}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${fix(v)}</text>`; });
    s += `<text x="${L + gw * j + gw / 2}" y="${H - 12}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(mFmt(x.m))}</text>`;

}

/* ============ signature pads ============ */
function initPad(cv) {
  const k = cv.dataset.pad; const dpr = Math.max(1, window.devicePixelRatio || 1);
  const fit = () => { const w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); if (R.sign[k].sig) { const im = new Image(); im.onload = () => c.drawImage(im, 0, 0, w, h); im.src = R.sign[k].sig; } };
  fit();
  const c = cv.getContext('2d'); let drawing = false, last = null, dirty = false;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); c.strokeStyle = '#0d2a5c'; c.lineWidth = 2.2; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); last = p; dirty = true; });
  const end = () => { if (!drawing) return; drawing = false; if (dirty) { R.sign[k].sig = cv.toDataURL('image/png'); touch(); dirty = false; } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

    const ii = r.invs.indexOf(inv), it = EST.invTot[ii], multi = r.invs.length > 1;
    heading('Energy Generated', it.n ? `Total ${fix(it.sum)} kWh  ·  average ${fix(it.avg)} kWh/month` : '');
    if (inv.noData) table([{ w: 1 }], [Object.assign([{ t: 'No historical energy data available on this inverter' + (inv.noDataNote ? ' – ' + inv.noDataNote : '') + '.', font: FB, color: C.warn }], { bg: C.warnBg })], { noHead: true });
    else table(multi ? [{ w: 0.34, label: 'Month' }, { w: 0.33, label: 'Energy generated (kWh)', align: 'r' }, { w: 0.33, label: 'Share of plant total', align: 'r' }] : [{ w: 0.5, label: 'Month' }, { w: 0.5, label: 'Energy generated (kWh)', align: 'r' }],
      EST.rows.map(x => { const v = x.vals[ii]; const row = [mFmt(x.m), isFinite(v) ? fix(v) : { t: 'No data', color: C.mute }]; if (multi) row.push(isFinite(v) && x.tot > 0 ? fix(v / x.tot * 100, 1) + ' %' : ''); return row; }));
    checklist(SECTIONS.find(s => s.key === 'test'), inv);
    heading('Faults & Parts');
    table([{ w: 0.28 }, { w: 0.72 }], [[{ t: 'Fault description', color: C.mute }, inv.fault.desc || '-'], [{ t: 'Parts replaced / required', color: C.mute }, inv.fault.parts || '-'], [{ t: 'Warranty / non-warranty', color: C.mute }, { t: inv.fault.warranty || '-', font: FB, color: inv.fault.warranty === 'Non-warranty' ? C.warn : C.ink }], [{ t: 'Remarks', color: C.mute }, inv.fault.remarks || '-']], { noHead: true });
  }
  function checklist(sec, inv) {
    heading(sec.title);
    table([{ w: 0.30, label: 'Item' }, { w: 0.22, label: 'Status' }, { w: 0.48, label: 'Details' }], sec.items.map(([k, label]) => { const it = inv[sec.key][k]; const t = toneOf(sec.key, k, it.s); return [label, { t: it.s || 'Not checked', font: FB, color: it.s ? toneC(t) : C.mute }, it.n || '']; }));
  }

  /* energy: all inverters */
  newPage();
  const st = EST, ni = r.invs.length, small = ni > 4;
  heading(ni > 1 ? 'Energy Generated – All Inverters' : 'Energy Summary', st.n ? `Plant total ${fix(st.total)} kWh  ·  average ${fix(st.avg)} kWh/month` : '');
  {
    const iw = 0.50 / ni;
    const cols = [{ w: 0.18, label: 'Month' }].concat(r.invs.map(inv => ({ w: iw, label: inv.no, align: 'r' })), [{ w: 0.16, label: 'Plant total (kWh)', align: 'r' }, { w: 0.16, label: 'kWh/kWp/day', align: 'r' }]);
    const ND = { t: 'No data', color: C.mute };
    const rows = st.rows.map(x => [mFmt(x.m)].concat(x.vals.map(v => (isFinite(v) ? fix(v) : ND)), [{ t: isFinite(x.tot) ? fix(x.tot) : '', font: FB }, isFinite(x.sy) ? fix(x.sy, 2) : '']));
    if (st.n) { const tr = [{ t: 'Total', font: FB }].concat(st.invTot.map((t, i) => (r.invs[i].noData ? ND : { t: t.n ? fix(t.sum) : '', font: FB })), [{ t: fix(st.total), font: FB }, '']); tr.bg = C.head; rows.push(tr); }
    if (ni > MANY) {   // one row per inverter, months across
      const nm = st.rows.length, mw = 0.84 / (nm + 1);
      const c2 = [{ w: 0.16, label: 'Inverter' }].concat(st.rows.map(x => ({ w: mw, label: mFmt(x.m), align: 'r' })), [{ w: mw, label: 'Total (kWh)', align: 'r' }]);
      const r2 = r.invs.map((inv, i) => [inv.no].concat(st.rows.map(x => (isFinite(x.vals[i]) ? fix(x.vals[i]) : ND)), [inv.noData ? ND : { t: st.invTot[i].n ? fix(st.invTot[i].sum) : '', font: FB }]));
      const pt = [{ t: 'Plant total', font: FB }].concat(st.rows.map(x => ({ t: isFinite(x.tot) ? fix(x.tot) : '', font: FB })), [{ t: st.n ? fix(st.total) : '', font: FB }]); pt.bg = C.head; r2.push(pt);
      if (st.rows.some(x => isFinite(x.sy))) r2.push(['kWh/kWp/day'].concat(st.rows.map(x => (isFinite(x.sy) ? fix(x.sy, 2) : '')), ['']));
      table(c2, r2, { size: 8, gap: 6 });
    } else table(cols, rows, { size: small ? 7.4 : 8.6, gap: 6 });
    const nds = r.invs.filter(v => v.noData);
    if (nds.length) table([{ w: 1 }], nds.map(v => Object.assign([{ t: `${v.no}: no historical energy data available on the inverter${v.noDataNote ? ' – ' + v.noDataNote : ''}. Not included in the plant total.`, color: C.warn }], { bg: C.warnBg })), { noHead: true, size: 8.2 });
  }
  const ser = chartSeries(r), mx = Math.max(0, ...st.rows.flatMap(x => ser.map(sr => { const v = sr.v(x); return isFinite(v) ? v : 0; })));
  if (mx > 0) {
    if (ni > MANY) heading('Monthly Plant Total');
    const ch = 150; ensure(ch + 50);
    const step = niceStep(mx / 4), top = Math.ceil(mx / step) * step, L = M + 46, W = CW - 56, base = y - ch - 10;
    txt('kWh', M, base + ch + 8, { size: 7.5, color: C.mute });
    for (let v = 0; v <= top + 1e-9; v += step) { const yy = base + v / top * ch; page.drawLine({ start: { x: L, y: yy }, end: { x: L + W, y: yy }, thickness: 0.4, color: C.line }); const t = fix(v); txt(t, L - 6 - F.widthOfTextAtSize(t, 7.5), yy - 2.5, { size: 7.5, color: C.mute }); }
    const na = Math.max(1, ser.length);
    const gw = W / st.rows.length, bw = gw * 0.72 / na;
    st.rows.forEach((x, j) => {
      const g0 = L + gw * j + gw * 0.14;
      ser.forEach((sr, k) => { const v = sr.v(x); if (!isFinite(v)) return; const h = v / top * ch, bx = g0 + bw * k;
        page.drawRectangle({ x: bx + 0.4, y: base, width: Math.max(0.8, bw - 0.8), height: h, color: hexRgb(sr.col) });
        if (na === 1) { const t = fix(v); txt(t, bx + bw / 2 - F.widthOfTextAtSize(t, 7.5) / 2, base + h + 3, { size: 7.5 }); } });
      const ml = WA(mFmt(x.m)); txt(ml, L + gw * j + gw / 2 - F.widthOfTextAtSize(ml, 8) / 2, base - 12, { size: 8, color: C.mute });
    });
    y = base - 24;
    if (ni > MANY) { txt('Bars show the plant total per month (sum of the inverters with data).', L, y, { size: 8, color: C.mute }); y -= 16; }
    else if (ni > 1) { let lx = L; r.invs.forEach((inv, i) => { const t = WA(inv.no + (inv.noData ? ' (no data)' : '')); const w = F.widthOfTextAtSize(t, 8); if (lx + 14 + w > PW - M) { lx = L; y -= 12; } page.drawRectangle({ x: lx, y: y - 1, width: 8, height: 8, color: hexRgb(serCol(i)) }); txt(t, lx + 11, y, { size: 8, color: C.mute }); lx += 22 + w; }); y -= 16; }
  }
  heading('Comments');
  table([{ w: 1 }], [[r.comments || '-']], { noHead: true });

  /* signatures */
  ensure(190); heading('Signatures');   // keep the heading with the signature table
  const sigImgs = { eng: await embedImg(doc, r.sign.eng.sig), cli: await embedImg(doc, r.sign.cli.sig) };
  const rowH = 54; ensure(18 + rowH * 2 + 10);
  const cw = [0.26, 0.26, 0.30, 0.18].map(w => w * CW);
  const hdr = ['', 'Name', 'Signature', 'Date']; let xx = M;
  page.drawRectangle({ x: M, y: y - 16, width: CW, height: 16, color: C.head }); hdr.forEach((h, i) => { txt(h, xx + 4, y - 11, { font: FB, size: 8, color: C.mute }); xx += cw[i]; }); y -= 16;
  [['eng', 'Service Engineer'], ['cli', 'Client Representative']].forEach(([k, l]) => {
    const s = r.sign[k]; let x = M;
    txt(l, x + 4, y - 20, { font: FB, size: 9 }); x += cw[0];
    wrapT(WA(s.name || ''), F, 9, cw[1] - 8).slice(0, 3).forEach((ln, j) => txt(ln, x + 4, y - 20 - j * 11, { size: 9 })); x += cw[1];
    const im = sigImgs[k]; if (im) { const h = rowH - 8, w = Math.min(cw[2] - 8, h * im.width / im.height); page.drawImage(im, { x: x + 4, y: y - rowH + 4, width: w, height: h }); } x += cw[2];
    txt(dFmt(s.date), x + 4, y - 20, { size: 9 });
    page.drawLine({ start: { x: M, y: y - rowH }, end: { x: PW - M, y: y - rowH }, thickness: 0.4, color: C.line });
    y -= rowH;
  });
  y -= 10;

  /* photos */
  if (r.photos.length) {
    newPage(); heading('Photos', r.photos.length + ' photo' + (r.photos.length === 1 ? '' : 's'));
    const colW = (CW - 12) / 2; let col = 0, rowTop = y, rowMax = 0;
    for (const [j, p] of r.photos.entries()) {
      const im = await embedImg(doc, p.data); if (!im) continue;
      const w = colW, h = Math.min(220, w * im.height / im.width), capL = wrapT(WA(p.cap || 'Photo ' + (j + 1)), F, 8.5, colW).slice(0, 3), need = h + 6 + capL.length * 11 + 10;
      if (col === 0) { if (y - need < BOTTOM) { newPage(); } rowTop = y; rowMax = 0; }
      const x = M + col * (colW + 12);
      page.drawImage(im, { x: x + (colW - w) / 2, y: rowTop - h, width: w, height: h });
      capL.forEach((ln, q) => txt(ln, x, rowTop - h - 11 - q * 11, { size: 8.5, color: C.mute }));
      rowMax = Math.max(rowMax, need);
      col = 1 - col; if (col === 0) y = rowTop - rowMax;
    }
    if (col === 1) y = rowTop - rowMax;
  }

  /* footer on every page */
  const pages = doc.getPages(), n = pages.length;
  pages.forEach((pg, i) => {
    page = pg; let fy = M - 10 + footH - 6;
    pg.drawLine({ start: { x: M, y: fy + 6 }, end: { x: PW - M, y: fy + 6 }, thickness: 0.6, color: C.line });
    fy -= 4;
    txt(CO.copy(), M, fy, { font: FB, size: FOOT_FS });
    const pn = `Page ${i + 1} of ${n}`; txt(pn, PW - M - F.widthOfTextAtSize(pn, 7.5), fy, { size: 7.5, color: C.mute });
    noticeLines.forEach(ln => { fy -= FOOT_LH; txt(ln, M, fy, { size: FOOT_FS, color: C.mute }); });
    fy -= FOOT_LH; txt(WA(CO.addr), M, fy, { font: FB, size: FOOT_FS, color: C.mute });
  });
  return await doc.save();
}
function hexRgb(h) { return PDFLib.rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255); }

/* ============ notice + boot ============ */
$('#notice').innerHTML = `<b>${esc(CO.copy())}</b><span>${esc(CO.notice)}</span><span>${esc(CO.addr)}</span>`;
(async function boot() {

  const list = await dbAll();
  if (!list.length && !LS.get('rsr-example-seeded')) { await dbPut(exampleReport()); LS.set('rsr-example-seeded', '1'); if (VIEW === 'home') render(); }
  if (!inClaude() && 'serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('./sw.js', { scope: './' }); } catch (e) { }
  }
})();
</script>
